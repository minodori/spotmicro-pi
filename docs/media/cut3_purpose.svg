<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080"><rect width="1920" height="1080" fill="#0d0d10"/><text x="90" y="88" font-family="Noto Sans CJK KR, sans-serif" font-size="30" fill="#8b8b95" font-weight="600" text-anchor="start">K I N E T I Q</text><line x1="90" y1="106" x2="308" y2="106" stroke="#8b8b95" stroke-width="2"/><text x="960" y="330" font-family="Noto Sans CJK KR, sans-serif" font-size="60" fill="#8b8b95" font-weight="500" text-anchor="middle">상용 4족보행 로봇은 수천만 원입니다</text><text x="960" y="415" font-family="Noto Sans CJK KR, sans-serif" font-size="60" fill="#8b8b95" font-weight="500" text-anchor="middle">설계와 코드가 공개된 대안이 있습니다</text><text x="960" y="590" font-family="Noto Sans CJK KR, sans-serif" font-size="62" fill="#ffffff" font-weight="500" text-anchor="middle">저희는 그것을 그대로 따라 만들었지만</text><text x="960" y="675" font-family="Noto Sans CJK KR, sans-serif" font-size="76" fill="#ffffff" font-weight="700" text-anchor="middle">걷지 않았습니다</text><text x="960" y="830" font-family="Noto Sans CJK KR, sans-serif" font-size="58" fill="#4aa3ff" font-weight="500" text-anchor="middle">왜 걷지 않는지 알아내</text><text x="960" y="905" font-family="Noto Sans CJK KR, sans-serif" font-size="58" fill="#4aa3ff" font-weight="600" text-anchor="middle">누구나 재현할 수 있게 만들었습니다</text></svg>