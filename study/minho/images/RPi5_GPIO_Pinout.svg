      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO10 (MOSI)</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">19</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">20</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#2c2c2c"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GND</text>
    </g>

    <!-- Row 11 -->
    <g transform="translate(0,490)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#8e44ad"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO9 (MISO)</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">21</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">22</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO25</text>
    </g>

    <!-- Row 12 -->
    <g transform="translate(0,528)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#8e44ad"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO11 (SCLK)</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">23</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">24</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#8e44ad"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO8 (CE0)</text>
    </g>

    <!-- Row 13 -->
    <g transform="translate(0,566)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#2c2c2c"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GND</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">25</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">26</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#8e44ad"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO7 (CE1)</text>
    </g>

    <!-- Row 14 -->
    <g transform="translate(0,604)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#8e44ad"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">ID_SD (EEPROM)</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">27</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">28</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#8e44ad"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">ID_SC (EEPROM)</text>
    </g>

    <!-- Row 15 -->
    <g transform="translate(0,642)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO5</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">29</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">30</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#2c2c2c"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GND</text>
