      <rect x="220" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO6</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">31</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">32</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO12</text>
    </g>

    <!-- Row 17 -->
    <g transform="translate(0,718)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO13</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">33</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">34</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#2c2c2c"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GND</text>
    </g>

    <!-- Row 18 -->
    <g transform="translate(0,756)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO19 (PCM_FS)</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">35</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">36</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO16</text>
    </g>

    <!-- Row 19 -->
    <g transform="translate(0,794)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO26</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">37</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">38</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO20 (PCM_DIN)</text>
