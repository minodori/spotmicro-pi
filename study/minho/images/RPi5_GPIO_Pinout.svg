<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="Helvetica, Arial, sans-serif">
  <style>
    .pin { font-size: 13px; fill: #1a1a1a; }
    .pinnum { font-size: 12px; fill: #ffffff; font-weight: bold; }
    .label { font-size: 12px; fill: #1a1a1a; }
    .title { font-size: 20px; font-weight: bold; fill: #1a1a1a; }
    .subtitle { font-size: 13px; fill: #555555; }
    .legend { font-size: 12px; fill: #1a1a1a; }
  </style>

  <rect x="0" y="0" width="900" height="900" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" class="title">Raspberry Pi 5 — 40-pin GPIO Header</text>
  <text x="450" y="54" text-anchor="middle" class="subtitle">SpotMicroJetson (RPi 5 마이그레이션) — PCA9685 I2C 배선 핀 강조 표시</text>

  <!-- Legend -->
  <g transform="translate(60,70)">
    <rect x="0" y="0" width="14" height="14" fill="#e74c3c"/>
    <text x="20" y="11" class="legend">전원 (3.3V/5V)</text>
    <rect x="150" y="0" width="14" height="14" fill="#2c2c2c"/>
    <text x="170" y="11" class="legend">GND</text>
    <rect x="230" y="0" width="14" height="14" fill="#2980b9"/>
    <text x="250" y="11" class="legend">I2C (SDA/SCL) — PCA9685</text>
    <rect x="460" y="0" width="14" height="14" fill="#27ae60"/>
    <text x="480" y="11" class="legend">GPIO (범용)</text>
    <rect x="600" y="0" width="14" height="14" fill="#8e44ad"/>
    <text x="620" y="11" class="legend">UART / SPI / EEPROM</text>
  </g>

  <!-- Header block -->
  <g transform="translate(0,110)">
    <!-- column guide lines -->
    <line x1="410" y1="0" x2="410" y2="760" stroke="#cccccc" stroke-width="1"/>

    <!-- Row generator: 20 rows, each row 38px tall -->
    <!-- Row 1 : pin1 3V3 / pin2 5V -->
    <!-- left = odd pins (col starts x=60..380), right = even pins (col starts x=440..760) -->

    <!-- Helper grid drawn manually below -->
  </g>

  <!-- Rows -->
  <g font-family="Helvetica, Arial, sans-serif">
    <!-- Row template values -->
    <!-- Left pin box x=250 width=130 ; connector circle x=392 ; right connector circle x=428 ; right box x=440 width=130 -->

    <!-- Row 1 -->
    <g transform="translate(0,110)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#e74c3c"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">3V3 POWER</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">1</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">2</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#e74c3c"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">5V POWER</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0,148)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#2980b9"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO2 (SDA1)</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">3</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">4</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#e74c3c"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">5V POWER</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0,186)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#2980b9"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO3 (SCL1)</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">5</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">6</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#2c2c2c"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GND</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0,224)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO4 (GPCLK0)</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">7</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">8</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#8e44ad"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO14 (TXD0)</text>
    </g>

    <!-- Row 5 -->
    <g transform="translate(0,262)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#2c2c2c"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GND</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">9</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">10</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#8e44ad"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO15 (RXD0)</text>
    </g>

    <!-- Row 6 -->
    <g transform="translate(0,300)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO17</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">11</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">12</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO18 (PCM_CLK)</text>
    </g>

    <!-- Row 7 -->
    <g transform="translate(0,338)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO27</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">13</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">14</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#2c2c2c"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GND</text>
    </g>

    <!-- Row 8 -->
    <g transform="translate(0,376)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">GPIO22</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">15</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">16</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO23</text>
    </g>

    <!-- Row 9 -->
    <g transform="translate(0,414)">
      <rect x="220" y="0" width="160" height="28" rx="4" fill="#e74c3c"/>
      <text x="300" y="19" text-anchor="middle" class="label" fill="#fff">3V3 POWER</text>
      <circle cx="392" cy="14" r="10" fill="#333"/><text x="392" y="18" text-anchor="middle" class="pinnum">17</text>
      <circle cx="428" cy="14" r="10" fill="#333"/><text x="428" y="18" text-anchor="middle" class="pinnum">18</text>
      <rect x="440" y="0" width="160" height="28" rx="4" fill="#27ae60"/>
      <text x="520" y="19" text-anchor="middle" class="label" fill="#fff">GPIO24</text>
    </g>

    <!-- Row 10 -->
    <g transform="translate(0,452)">
