name: 버그 신고
description: 기대한 동작과 다르게 동작할 때
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **이 프로젝트에서는 하드웨어 차이가 대부분의 차이를 만듭니다.**
        같은 코드라도 서보와 링크 길이가 다르면 다르게 움직입니다.
        아래 하드웨어 항목을 채워 주시면 원인을 훨씬 빨리 좁힐 수 있습니다.

  - type: dropdown
    id: scope
    attributes:
      label: 어디에서 발생했나요
      options:
        - 시뮬레이션만 (로봇 없음)
        - 실물 로봇
        - 검증 스크립트 (validate_mjcf.py)
        - 학습 (train.py)
        - 설치·의존성
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작과 실제 동작
      placeholder: |
        기대: 명령 vx 0.2 를 주면 전진한다
        실제: 제자리에 선 채 움직이지 않는다
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      description: 실행한 명령을 그대로 붙여 주세요
      render: shell
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: 하드웨어 (실물 로봇을 쓰신다면)
      description: |
        서보를 바꾸거나 프레임을 수정하셨다면 그것은 버그가 아니라 정상적인 포크입니다.
        다만 값을 재서 `Kinematics/kinematics.py` 에 넣으셨는지 확인이 필요합니다.
      value: |
        서보 모델:
        링크 길이 l1/l2/l3/l4:
        몸통 L/W:
        전원:
      render: text

  - type: textarea
    id: validate
    attributes:
      label: 검증 결과
      description: |
        `uv run python rl/validate_mjcf.py` 출력을 붙여 주세요.
        기하 일치 게이트는 **0.0000 mm** 를 요구합니다.
      render: shell

  - type: input
    id: env
    attributes:
      label: 실행 환경
      placeholder: "Ubuntu 24.04 / Python 3.12 / uv 0.5.x"
