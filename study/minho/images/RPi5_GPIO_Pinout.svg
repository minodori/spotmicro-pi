  <!-- Highlight box around PCA9685 wiring pins (1,3,5,6) -->
  <rect x="205" y="105" width="440" height="114" rx="8" fill="none" stroke="#e67e22" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="655" y="166" class="legend" fill="#e67e22" font-weight="bold">← PCA9685 배선 (Pin 1,3,5,6)</text>
</svg>
